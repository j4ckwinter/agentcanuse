<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Can Use · Can AI agents’ browsers use the web?</title>
    <meta name="description" content="A nightly scoreboard of the browser engines AI agents use, Chromium, Lightpanda and Obscura, run against 124 real sites. Which ones render the page, find the content, and get let in." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://agentcanuse.com/" />
    <meta property="og:title" content="Agent Can Use" />
    <meta property="og:description" content="caniuse, but for the browsers AI agents use. Chromium, Lightpanda and Obscura against 124 real sites, every night." />
    <meta property="og:image" content="https://agentcanuse.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#08090a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <script>
      (() => {
        const root = document.documentElement
        let stored = null
        try {
          stored = window.localStorage.getItem('theme')
        } catch {}
        if (stored === 'light' || stored === 'dark') root.dataset.theme = stored
        root.dataset.resolvedTheme = root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
