name: Survey

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency: survey

permissions:
  contents: write

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .cache/engines
          key: engines-${{ runner.os }}-${{ hashFiles('engines.json') }}
      - run: npm ci
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run bench -- --origin data-centre
      - run: |
          git config user.name "agentcanuse survey"
          git config user.email "survey@users.noreply.github.com"
          git checkout -- public/data/index.json
          git pull --rebase
          npm run tidy
          git add public/data
          git commit -m "data: record survey run"
          git push
